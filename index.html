  .chunk{border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);}
  .pill-btn{border:2.5px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.2rem;}
  .pill-btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);}
  .pill-btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .pill-btn:disabled{opacity:.5;cursor:not-allowed;}
  button:focus-visible,input:focus-visible{outline:3px solid var(--tang);outline-offset:3px;}
  .opt{width:100%;text-align:left;border:2.5px solid var(--ink);border-radius:14px;padding:.8rem 1rem;transition:transform .12s;}

  .opt.is-dim{opacity:.45;}

     <div id="dots" class="flex flex-wrap justify-center gap-1.5"></div><button type="button" id="next" data-template-id="nav-next" class="canva-button pill-btn font-bold"><span data-template-id="nav-next-label" class="canva-text hidden sm:inline"></span><i data-lucide="chevron-right"></i></button>
    </nav>

  </div>
  <script>
  lucide.createIcons();
  const slides = [...document.querySelectorAll('[data-slide]')];
  const counter = document.querySelector('[data-template-id="slide-counter"]');
  const dotsEl = document.getElementById('dots');
  const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
  let cur = 0;

  slides.forEach((_, i) => {
    const d = document.createElement('button');
    d.type = 'button'; d.className = 'dot'; d.setAttribute('aria-label', 'Ke slide ' + (i + 1));
    d.addEventListener('click', () => go(i));
    dotsEl.appendChild(d);
  });
  const dots = [...dotsEl.children];

  function go(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    slides[cur].classList.remove('active');
    cur = i;
    slides[cur].classList.add('active');
    slides[cur].scrollTop = 0;
    counter.textContent = (cur + 1) + ' / ' + slides.length;
    document.getElementById('progress').style.width = ((cur + 1) / slides.length * 100) + '%';
    dots.forEach((d, k) => { d.classList.toggle('on', k === cur); d.setAttribute('aria-current', k === cur ? 'true' : 'false'); });
    prevBtn.disabled = cur === 0; nextBtn.disabled = cur === slides.length - 1;
    if (cur === 12) renderScore();
  }
  prevBtn.addEventListener('click', () => go(cur - 1));
  nextBtn.addEventListener('click', () => go(cur + 1));
  document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => go(+b.dataset.goto)));
  document.addEventListener('keydown', e => {
    if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (e.key === 'ArrowRight') go(cur + 1);
    if (e.key === 'ArrowLeft') go(cur - 1);
  });

  // Game
  const gameScoreEl = document.querySelector('[data-template-id="game-score"]');
  let gameScore = 0;
  gameScoreEl.textContent = '0 / 4';
  document.querySelectorAll('.game-card').forEach(card => {
    card.querySelectorAll('[data-pick]').forEach(btn => btn.addEventListener('click', () => {
      const ok = btn.dataset.pick === card.dataset.answer;
      card.querySelectorAll('[data-pick]').forEach(b => b.disabled = true);
      btn.classList.add('choice', 'is-picked');
      card.querySelector(ok ? '[data-fb="ok"]' : '[data-fb="no"]').classList.remove('hidden');
      if (ok) gameScore++;
      gameScoreEl.textContent = gameScore + ' / 4';
    }));
  });

  // Quiz
  const qs = [...document.querySelectorAll('.quiz-q')];
  const qProg = document.querySelector('[data-template-id="quiz-progress"]');
  const fOk = document.getElementById('qf-ok'), fNo = document.getElementById('qf-no');
  const qNext = document.getElementById('quiz-next'), qFinish = document.getElementById('quiz-finish');
  let qi = 0, quizScore = 0, quizDone = false;

  function showQ(i) {
    qs.forEach((q, k) => q.classList.toggle('hidden', k !== i));
    qProg.textContent = (i + 1) + ' / ' + qs.length;
    [fOk, fNo, qNext, qFinish].forEach(el => el.classList.add('hidden'));
  }
  qs.forEach(q => q.querySelectorAll('.opt').forEach(opt => opt.addEventListener('click', () => {
    const ok = opt.dataset.opt === q.dataset.answer;
    q.querySelectorAll('.opt').forEach(o => {
      o.disabled = true;
      if (o.dataset.opt === q.dataset.answer) o.classList.add('is-right');
      else if (o !== opt) o.classList.add('is-dim');
    });
    if (!ok) opt.classList.add('is-wrong'); else quizScore++;
    (ok ? fOk : fNo).classList.remove('hidden');
    (qi === qs.length - 1 ? qFinish : qNext).classList.remove('hidden');
    (qi === qs.length - 1 ? qFinish : qNext).focus();
  })));
  qNext.addEventListener('click', () => { qi++; showQ(qi); });
  qFinish.addEventListener('click', () => { quizDone = true; go(12); });

  function resetQuiz() {
    qi = 0; quizScore = 0; quizDone = false;
    document.querySelectorAll('.opt').forEach(o => { o.disabled = false; o.classList.remove('is-right', 'is-wrong', 'is-dim'); });
    showQ(0);
  }
  function renderScore() {
    document.getElementById('score-box').classList.toggle('hidden', !quizDone);
    document.getElementById('score-pending').classList.toggle('hidden', quizDone);
    document.querySelector('[data-template-id="score-value"]').textContent = quizScore;
    const tier = quizScore >= 8 ? 'high' : quizScore >= 5 ? 'mid' : 'low';
    document.querySelectorAll('[data-tier]').forEach(el => el.classList.toggle('hidden', !quizDone || el.dataset.tier !== tier));
  }
  document.getElementById('score-retry').addEventListener('click', () => { resetQuiz(); go(11); });

  // Reflection
  document.querySelectorAll('.choice').forEach(c => {
    if (!c.closest('[role="group"]')) return;
    c.setAttribute('aria-pressed', 'false');
    c.addEventListener('click', () => {
      c.parentElement.querySelectorAll('.choice').forEach(x => { x.classList.remove('is-picked'); x.setAttribute('aria-pressed', 'false'); });
      c.classList.add('is-picked'); c.setAttribute('aria-pressed', 'true');
      document.getElementById('refl-thanks').classList.remove('hidden');
    });
  });

  showQ(0);
  go(0);
</script>
